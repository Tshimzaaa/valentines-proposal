<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal | Tshimzaaa</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Add EmailJS Library -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init('OJSG_cOX4keD0tiPJ'); // Replace with your EmailJS public key
        })();
    </script>
</head>
<body>
    <div class="container">
        <h2 class="decorations" id="question">Will you be my Valentine? 💞</h2>
        <div class="buttons">
            <button class="button yes-button">💖 Yes</button>
            <button class="button no-button">💔 No</button>
        </div>
    </div>

    <script>
        let yesClicks = 0;
        const messages = [
            "Are you sure? 💖",
            "Really? 😊",
            "YAY! You've made me the happiest! 💞🥰 I love you to the moon and back! 🌙✨"
        ];
        
        const noButton = document.querySelector('.no-button');
        const yesButton = document.querySelector('.yes-button');
        const question = document.getElementById('question');

        function sendResponse(response) {
            emailjs.send('service_tshimzaaa', 'template_u181rop', {
                response_type: 'Valentine Proposal',
                user_response: response
            }).then(
                () => console.log('Response recorded'),
                (error) => console.error('Error:', error)
            );
        }

        yesButton.addEventListener('click', function() {
            if(yesClicks < 2) {
                question.textContent = messages[yesClicks];
                yesClicks++;
                if(yesClicks === 1) sendResponse('First Yes');
                if(yesClicks === 2) sendResponse('Second Yes');
            } else {
                sendResponse('Final Yes');
                showFinalMessage();
            }
        });

        noButton.addEventListener('click', function() {
            question.innerHTML = "😢 My heart is broken... 💔 But I'll always hope 💖";
            document.querySelector('.buttons').innerHTML = '';
            sendResponse('No');
        });

        function showFinalMessage() {
            document.body.innerHTML = `
                <div class="container">
                    <h1 class="decorations">${messages[2]}</h1>
                    <a href="index.html" class="back-link">← Back to Start</a>
                </div>
            `;
        }
    </script>
</body>
</html>
